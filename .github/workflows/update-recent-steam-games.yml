name: Deploy site with recent Steam games

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Fetch recently played games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_IDS: ${{ secrets.STEAM_IDS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen

          api_key = os.environ.get('STEAM_API_KEY')
          steam_ids_json = os.environ.get('STEAM_IDS')
          if not api_key or not steam_ids_json:
              print('STEAM_API_KEY or STEAM_IDS is not configured; skipping update.')
              raise SystemExit(0)

          try:
              steam_ids = json.loads(steam_ids_json)
          except json.JSONDecodeError as error:
              raise ValueError('STEAM_IDS must be a JSON array of Steam IDs.') from error

          if not isinstance(steam_ids, list) or not all(isinstance(steam_id, str) and steam_id for steam_id in steam_ids):
              raise ValueError('STEAM_IDS must be a JSON array of non-empty Steam ID strings.')

          def fetch_json(url):
              with urlopen(url, timeout=30) as response:
                  return json.load(response)

          def resolve_steam_id(profile_identifier):
              if profile_identifier.isdecimal():
                  return profile_identifier

              vanity_query = urlencode({'key': api_key, 'vanityurl': profile_identifier, 'format': 'json'})
              vanity_url = f'https://api.steampowered.com/ISteamUser/ResolveVanityURL/v0001/?{vanity_query}'
              vanity_data = fetch_json(vanity_url).get('response', {})
              steam_id = vanity_data.get('steamid')
              if vanity_data.get('success') != 1 or not isinstance(steam_id, str):
                  raise ValueError(vanity_data.get('message', 'Steam could not resolve this vanity profile name.'))
              return steam_id

          profiles = []
          for profile_identifier in steam_ids:
              try:
                  steam_id = resolve_steam_id(profile_identifier)
                  player_query = urlencode({'key': api_key, 'steamids': steam_id, 'format': 'json'})
                  player_url = f'https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?{player_query}'
                  player_data = fetch_json(player_url)
                  players = player_data.get('response', {}).get('players', [])
                  player = players[0] if players else {}
                  if not player.get('personaname'):
                      raise ValueError('Steam did not return a public player profile.')

                  recent_games_query = urlencode({'key': api_key, 'steamid': steam_id, 'format': 'json'})
                  recent_games_url = f'https://api.steampowered.com/IPlayerService/GetRecentlyPlayedGames/v1/?{recent_games_query}'
                  recent_games_data = fetch_json(recent_games_url)
                  games = recent_games_data.get('response', {}).get('games', [])
                  profiles.append(
                      {
                          'player': {
                              'name': player['personaname'],
                              'avatar': player.get('avatarfull', ''),
                          },
                          'games': [
                              {
                                  'appid': game['appid'],
                                  'playtime_2weeks': game.get('playtime_2weeks', 0),
                                  'playtime_forever': game.get('playtime_forever', 0),
                              }
                              for game in sorted(
                                  games,
                                  key=lambda game: game.get('playtime_2weeks', 0),
                                  reverse=True,
                              )[:5]
                          ],
                      }
                  )
              except (HTTPError, URLError, TimeoutError, ValueError, json.JSONDecodeError, KeyError, TypeError, AttributeError) as error:
                  print(f'Warning: Skipping Steam profile {profile_identifier!r}: {error}')

          with open('assets/data/recent-games.json', 'w', encoding='utf-8') as file:
              json.dump({'profiles': profiles}, file, indent=2)
              file.write('\n')
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
